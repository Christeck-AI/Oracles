<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a241b" />
      <stop offset="60%" stop-color="#14110e" />
      <stop offset="100%" stop-color="#080706" />
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89c" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa820a" />
      <stop offset="100%" stop-color="#f9df74" />
    </linearGradient>

    <linearGradient id="stoneBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4237" />
      <stop offset="50%" stop-color="#2b2620" />
      <stop offset="100%" stop-color="#181512" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Granite Stone Base -->
  <rect x="20" y="20" width="760" height="760" rx="30" fill="url(#bgGlow)" stroke="url(#stoneBorder)" stroke-width="12" />
  
  <!-- Outer Runic Ring Border -->
  <rect x="45" y="45" width="710" height="710" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6" />
  <circle cx="400" cy="400" r="320" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
  <circle cx="400" cy="400" r="290" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />

  <!-- Corner Ornamental Knotwork Motif -->
  <path d="M 60 120 C 60 70 70 60 120 60 L 200 60" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 740 120 C 740 70 730 60 680 60 L 600 60" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 60 680 C 60 730 70 740 120 740 L 200 740" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 740 680 C 740 730 730 740 680 740 L 600 740" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Elder Futhark Frame Text -->
  <text x="400" y="110" font-family="Cinzel, serif, Georgia" font-size="22" fill="#d4af37" text-anchor="middle" letter-spacing="8" opacity="0.8">ELDER FUTHARK • RUNIC ORACLE</text>

  <!-- Central Rune Glyph -->
  <text x="400" y="440" font-family="'Segoe UI Historic', 'Noto Sans Runic', sans-serif" font-size="260" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">ᛒ</text>

  <!-- Deity / Power Title -->
  <text x="400" y="630" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="42" fill="#f4efe4" text-anchor="middle" letter-spacing="4">BERKANO</text>
  <text x="400" y="680" font-family="'Inter', sans-serif" font-size="22" fill="#d4af37" text-anchor="middle" letter-spacing="2" opacity="0.9">Frigg & Idunn</text>
  
  <text x="400" y="730" font-family="sans-serif" font-size="14" fill="#8a7e6b" text-anchor="middle" letter-spacing="6">ORACLES OF INDIVIDUATION</text>
</svg>
